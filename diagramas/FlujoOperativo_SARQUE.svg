: 1.0;"/><line style="stroke: #424242; stroke-width: 1.5;" x1="396" x2="418.5" y1="1356.7471" y2="1356.7471"/><polygon fill="#424242" points="414.5,1397.5361,418.5,1407.5361,422.5,1397.5361,418.5,1401.5361" style="stroke: #424242; stroke-width: 1.5;"/><line style="stroke: #424242; stroke-width: 1.5;" x1="418.5" x2="418.5" y1="1356.7471" y2="1449.9229"/><line style="stroke: #424242; stroke-width: 1.5;" x1="418.5" x2="318.5" y1="1449.9229" y2="1449.9229"/><line style="stroke: #424242; stroke-width: 1.5;" x1="318.5" x2="318.5" y1="1449.9229" y2="1469.9229"/><polygon fill="#424242" points="314.5,1459.9229,318.5,1469.9229,322.5,1459.9229,318.5,1463.9229" style="stroke: #424242; stroke-width: 1.0;"/><line style="stroke: #424242; stroke-width: 1.5;" x1="318.5" x2="318.5" y1="1323.9424" y2="1343.9424"/><polygon fill="#424242" points="314.5,1333.9424,318.5,1343.9424,322.5,1333.9424,318.5,1337.9424" style="stroke: #424242; stroke-width: 1.0;"/><!--MD5=[cd4a4cf6d103b623b3e6c34d5e3c6f81]
@startuml FlujoOperativo_SARQUE
skinparam backgroundColor #FFFFFF
skinparam activity {
  BackgroundColor #E3F2FD
  BorderColor #1565C0
  ArrowColor #424242
  StartColor #2E7D32
  EndColor #C62828
  DiamondBackgroundColor #FFF3E0
  DiamondBorderColor #F57C00
}
skinparam shadowing false

title <b>Diagrama de Flujo Operativo — Riego Automatizado SARQUE</b>

start
:Administrador revisa\npronóstico al inicio del día;

if (¿Llovió o se pronostica lluvia?) then (Sí)
  :Suspender programas en\nlos controladores BL-KR\n(función ON/OFF\nen app K-RainBL);
  stop
else (No)
endif

:Sistema en operación normal;

:Esperar siguiente horario\nprogramado en cronograma;

partition "**Controlador BL-KR**" {
  :Llega la hora programada\n(p.ej. 10:00 Lunes\nestación 1);
  :Envía pulso DC (+)\nal solenoide;
}

partition "**Electroválvula**" {
  :Solenoide abre la\nelectroválvula;
  :Agua fluye desde\nmatriz 2" hacia el sector;
}

partition "**Sector regado**" {
  :Riego durante 2 horas\n(o tiempo programado);
}

partition "**Controlador BL-KR**" {
  :Termina duración programada;
  :Envía pulso DC (-)\nal solenoide;
}

partition "**Electroválvula**" {
  :Solenoide cierra la\nelectroválvula;
  :Corte de flujo;
}

:Bomba detecta caída de demanda\ny se apaga al alcanzar 4.0 bar\n(presostato + tanque hidroneumático);

if (¿Quedan más horarios\nen el día?) then (Sí)
  -> volver a esperar;
  :Esperar siguiente horario;
  detach
else (No)
endif

stop

@enduml

